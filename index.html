<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Realmbreach: Legacy | Character Inspiration</title><style>
:root{color-scheme:dark;--bg:#151c1c;--panel:#232c2a;--line:#47534b;--gold:#d6b77b;--text:#f1eee3;--muted:#b8bdb2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#34413b,#151c1c 65%);color:var(--text);font:16px/1.5 Georgia,serif;min-height:100vh}.wrap{max-width:750px;margin:auto;padding:32px 18px 60px}header{text-align:center;margin-bottom:24px}h1{font-size:clamp(2rem,6vw,3rem);color:var(--gold);margin:0}h2{font-size:1.1rem;color:var(--gold);margin:0}p{color:var(--muted)}.panel{background:rgba(35,44,42,.96);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 10px 25px #0003}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}label{display:block;margin-bottom:7px;color:var(--gold)}input,textarea{width:100%;background:#151d1b;color:var(--text);border:1px solid #667166;border-radius:8px;padding:12px;font:inherit}textarea{min-height:86px;resize:vertical}button{border:1px solid #b9a177;border-radius:8px;background:#b99a62;color:#141a17;font:600 15px system-ui,sans-serif;padding:11px 15px;cursor:pointer}button:hover{filter:brightness(1.12)}button.secondary{background:transparent;color:var(--gold)}.actions{display:flex;flex-wrap:wrap;gap:10px}.actions button{flex:1}small{color:var(--muted)}#status{min-height:1.5em;color:#bce5bd;text-align:center}footer{text-align:center;margin-top:28px;color:var(--muted)}@media(max-width:480px){.head{align-items:flex-start}.panel{padding:15px}button{padding:10px}}
</style></head><body><main class="wrap"><header><h1>Realmbreach: Legacy</h1><p>Character Inspiration Generator</p><p>Three ideas for your adventurer aboard the <em>Lioness</em>. Reroll freely, edit anything, and keep only what inspires you.</p></header><section class="panel"><label for="character">Character name</label><input id="character" placeholder="Enter your character's name"><label for="player" style="margin-top:12px">Player name (optional)</label><input id="player" placeholder="Your name or Discord handle"></section><div id="cards"></div><div class="actions"><button id="all" class="secondary">🎲 Reroll all</button><button id="copy">📋 Copy for Discord</button></div><p id="status" role="status" aria-live="polite"></p><footer>These are prompts, not mandatory history. Ordinary lives can lead to extraordinary adventures.</footer></main><script>
const tables=[{title:'Motivation',question:'Why did you join the Lioness?',items:[
'I want to chart a place no one from Greyport has mapped.','I need to earn enough coin to clear a debt.','I hope to find evidence of a forgotten civilization.','I want to make a name for myself without relying on my family.','I am searching for someone who disappeared on the frontier.','I need a fresh start away from my old life.','I want to learn how strange magic works beyond the city.','I hope to find land where I can build a home.','I joined to protect someone else on the expedition.','I want to prove that an old story is true.','I am gathering rare materials for a personal project.','I want to become a skilled explorer, not just a dreamer.','I am chasing a rumor of a valuable discovery.','I hope to reconnect with distant relatives or my ancestry.','I want to study creatures that have never been catalogued.','I made a promise to see the world for someone who cannot.','I want to escape a reputation I did not earn.','I seek work that feels meaningful rather than comfortable.','I am fascinated by the Lioness and want to learn its secrets.','I simply want adventure before I settle down.']},
{title:'Background Hook',question:'What unfinished business follows you?',items:[
'I inherited a strange object whose purpose is unknown.','A former mentor vanished after an expedition.','I made a promise I have not kept.','I once saw something that nobody believed.','A failed venture cost my family dearly.','Someone falsely believes I stole from them.','I found a fragment of a map with one place marked.','An old friend stopped writing without explanation.','I possess a journal with several pages torn out.','I was once part of an expedition that ended badly.','A relative left me a sealed letter to open at a certain place.','I know a secret about a respected person in Greyport.','I owe a significant favor to someone I would rather avoid.','I have a recurring dream of an unfamiliar landscape.','I witnessed a dispute over ownership of a valuable discovery.','A tool or keepsake of mine bears an unfamiliar maker’s mark.','I left an important question unanswered when I moved away.','Someone keeps sending me anonymous warnings.','I accidentally damaged something that I hope to repair.','A childhood story contains a detail I later found to be real.']},
{title:'Personal Connection',question:'Who matters to you?',items:[
'A sibling who worries about me.','A former teacher at Greyport’s arcane academy.','A rival explorer who is always competing with me.','A merchant who helped me through a difficult time.','A friend who works on the Greyport docks.','A relative who disapproves of my travels.','A scholar who pays for unusual discoveries.','An old companion who knows my weaknesses.','A craftsperson who taught me my trade.','Someone who once saved my life.','A neighbor who expects me to come home safely.','A member of the city watch who trusts me.','A traveling trader who brings me news.','A childhood friend who took a very different path.','An estranged family member I hope to reconcile with.','A sailor who knew the first stories of the Lioness.','A healer who helped my family in a crisis.','A creditor who is not as cruel as people think.','A local historian who shares my curiosity.','Someone I have promised to support with my earnings.']}];
const cards=document.getElementById('cards');let last=[];function randomIndex(n,old=-1){let i=Math.floor(Math.random()*n);if(n>1&&i===old)i=(i+1+Math.floor(Math.random()*(n-1)))%n;return i}function reroll(i){last[i]=randomIndex(tables[i].items.length,last[i]);document.getElementById('answer'+i).value=tables[i].items[last[i]]}tables.forEach((t,i)=>{const s=document.createElement('section');s.className='panel';s.innerHTML=`<div class="head"><div><h2>${i+1}. ${t.title}</h2><small>${t.question}</small></div><button type="button" class="secondary" id="roll${i}">↻ Reroll</button></div><label for="answer${i}">Your answer (editable)</label><textarea id="answer${i}"></textarea>`;cards.appendChild(s);document.getElementById('roll'+i).addEventListener('click',()=>reroll(i));reroll(i)});document.getElementById('all').addEventListener('click',()=>tables.forEach((_,i)=>reroll(i)));document.getElementById('copy').addEventListener('click',async()=>{const value=id=>document.getElementById(id).value.trim();const result=`**Realmbreach: Legacy Character**\n**Character:** ${value('character')||'Unnamed'}\n**Player:** ${value('player')||'Not provided'}\n**Motivation:** ${value('answer0')}\n**Background Hook:** ${value('answer1')}\n**Personal Connection:** ${value('answer2')}`;try{await navigator.clipboard.writeText(result);document.getElementById('status').textContent='Copied! Paste it into the Discord character-backgrounds channel.'}catch(e){const area=document.createElement('textarea');area.value=result;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();document.getElementById('status').textContent='Copied. Paste into Discord.'}});
</script></body></html>
